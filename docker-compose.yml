# ===========================================================
# Foro TI - Docker Compose (desarrollo con base de datos externa)
# ===========================================================
# Uso:
#   docker compose up -d          → levanta la aplicación
#   docker compose logs -f app    → ver logs de la app
#   docker compose exec app php artisan migrate → migraciones
#   docker compose down           → apagar todo

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: foro-ti-app
    restart: unless-stopped
    ports:
      - "8000:80"
    env_file: .env
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_HOST=host.docker.internal
    volumes:
      # En desarrollo: monta el código fuente para hot-reload
      # Comenta estas líneas para producción
      - .:/var/www/html
      - /var/www/html/vendor       # excluir vendor del mount
      - /var/www/html/node_modules # excluir node_modules del mount
      - ./docker/php-dev.ini:/usr/local/etc/php/conf.d/99-dev.ini:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - foro-net

networks:
  foro-net:
    driver: bridge
